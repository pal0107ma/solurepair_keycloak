services:
  keycloakify:
    image: keycloakify
    build:
      context: .
      dockerfile: keycloakify.Dockerfile
    ports:
      - 6006:6006
    volumes:
      - ./:/app
      - keycloakify_volume:/app/node_modules # Evita conflictos con los módulos de node
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
  keycloak:
    image: solurepair-keycloak
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres/keycloakdb
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloakdbpass
      - KC_FEATURES=token-exchange:v1,admin-fine-grained-authz:v1
    ports:
      - 8080:8080
    depends_on:
      - postgres
    restart: unless-stopped
    command: start-dev

  postgres:
    image: postgres:17-alpine # Mismo en prod
    environment:
      - POSTGRES_DB=keycloakdb
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloakdbpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  keycloakify_volume:
